<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/arrow-blue.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aaron Weisenburger Portfolio</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space Grotesk:wght@300;500;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM Plex Sans:wght@400;500;600;700&display=swap"
    />
  </head>
  <body>
    <script>
      // Decodes the path-in-query-string that public/404.html encodes,
      // restoring the real URL (e.g. /projects/ammo-box) before React
      // Router mounts, so a refreshed or directly-visited route renders
      // correctly instead of redirecting to the homepage.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
