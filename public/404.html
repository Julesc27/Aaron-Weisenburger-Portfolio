<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // GitHub Pages serves this file for any path it doesn't recognize
      // as a real file (e.g. /projects/ammo-box). Since this is a
      // client-side-routed React app, that "unknown path" is usually a
      // real in-app route the visitor followed a link to (or refreshed
      // on) — this script re-encodes the path into a query string and
      // sends the browser back to index.html, which decodes it and lets
      // React Router take over. Without this, a shared project link or a
      // page refresh anywhere but the homepage would just show this
      // 404 instead of the actual page.
      var segmentCount = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
